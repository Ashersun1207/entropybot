name: EntropybotPhone
options:
  bundleIdPrefix: ai.cloudentropy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  configs:
    Debug:
      OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-expression-type-checking=500 -Xfrontend -warn-long-function-bodies=500"

packages:
  CompanionCore:
    path: ./CompanionCore
  WebRTC:
    path: ./WebRTC

schemes:
  OpenMausCompanion:
    build:
      targets:
        OpenMausCompanion: all

targets:
  OpenMausCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: AppShared
      - path: Shared
    dependencies:
      - package: CompanionCore
        product: CompanionCore
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.cloudentropy.entropybot.phone
        PRODUCT_NAME: Entropybot
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 88NP7P794V
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Entropybot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: ai.cloudentropy.entropybot.phone.pairing
            CFBundleURLSchemes:
              - entropybot
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: >-
          Entropybot finds your computer on this network so your bots can
          reach you here.
        NSCameraUsageDescription: >-
          Entropybot uses the camera only to scan a pairing QR code shown on
          your computer.
        NSMicrophoneUsageDescription: >-
          Entropybot listens while you dictate a message to a bot or talk
          to it on a Live call.
        NSSpeechRecognitionUsageDescription: >-
          Entropybot converts your speech into text so you can send it
          to a bot. Recognition runs on this phone when it can.
        NSBonjourServices:
          - _entropybot._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
