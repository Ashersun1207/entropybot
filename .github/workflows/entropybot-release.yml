name: Entropybot macOS release

on:
  push:
    tags: ["entropybot-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entropybot-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Ashersun1207/entropybot'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag and release identity
        id: version
        run: |
          node scripts/entropybot-release.mjs check
          echo "tag=entropybot-v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Verify updater boundary and migration contracts
        run: pnpm exec vitest run electron/entropybot-updater.test.mjs electron/updater.test.mjs server/local-computer.test.ts server/context-rebuild.test.ts server/drivers/chat-size-limit.test.ts server/recall.test.ts server/memory-embeddings.test.ts
      - name: Verify memory settings and secure credential contracts
        run: pnpm exec vitest run electron/memory-credentials.test.mjs electron/workspace-credentials.test.mjs electron/secure-credential-state.test.mjs server/workspace-backup-policy.test.ts server/memory-embedding-config.test.ts server/memory-embedding-client.test.ts server/memory-embedding-index.test.ts server/memory-embedding-auth.test.ts server/memory-embedding-settings.e2e.test.ts src/components/MemorySettings.test.ts src/components/SettingsModal.simple.test.ts src/state/memory-status.test.ts
      - run: node --test electron/workspace-credentials-save.node-test.mjs electron/credential-patch.node-test.mjs
      - name: Build Apple silicon application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm package:entropybot:mac
      - name: Verify bundle identity and signature
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' release/mac-arm64/Entropybot.app/Contents/Info.plist)" = ai.entropybot.desktop
          codesign --verify --deep --strict release/mac-arm64/Entropybot.app
          test -f release/mac-arm64/Entropybot.app/Contents/Resources/server/server/memory-embeddings.js
          node scripts/entropybot-release.mjs manifest
      - uses: actions/upload-artifact@v4
        with:
          name: entropybot-macos-arm64
          path: |
            release/Entropybot-*.dmg
            release/Entropybot-*.zip
            release/SHA256SUMS
            release/entropybot-build.json
          if-no-files-found: error
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" || { echo "Tag points at a different source commit; bump the version."; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --depth=1 --force origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" || { echo "Tag points at a different source commit; bump the version."; exit 1; }
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || { echo "Published releases are immutable; bump the version."; exit 1; }
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "Entropybot ${TAG#entropybot-v}" --notes-file docs/ENTROPYBOT_RELEASE_NOTES.md
          fi
          gh release upload "$TAG" release/Entropybot-*.dmg release/Entropybot-*.zip release/SHA256SUMS release/entropybot-build.json --clobber
