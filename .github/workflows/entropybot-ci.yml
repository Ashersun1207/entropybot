name: Entropybot checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: entropybot-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/entropybot-release.mjs check
      - run: node scripts/check-patches.mjs
      - run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: pnpm exec vitest run scripts/testing/file-size-ratchet.test.ts src/locales/vocabulary.test.ts server/update-check.test.ts
      - run: pnpm exec vitest run electron/entropybot-updater.test.mjs electron/updater.test.mjs server/local-computer.test.ts server/context-rebuild.test.ts server/drivers/chat-size-limit.test.ts server/recall.test.ts server/memory-embeddings.test.ts
      - run: pnpm exec vitest run electron/memory-credentials.test.mjs electron/workspace-credentials.test.mjs electron/secure-credential-state.test.mjs server/workspace-backup-policy.test.ts server/memory-embedding-config.test.ts server/memory-embedding-client.test.ts server/memory-embedding-index.test.ts server/memory-embedding-auth.test.ts server/memory-embedding-settings.e2e.test.ts src/components/MemorySettings.test.ts src/components/SettingsModal.simple.test.ts src/state/memory-status.test.ts
      - run: node --test electron/workspace-credentials-save.node-test.mjs electron/credential-patch.node-test.mjs
