name: Entropybot checks
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: entropybot-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: ci-contract
        run: pnpm exec vitest run scripts/entropybot-ci-workflow.test.ts
      - id: lint
        run: pnpm lint
      - id: identity
        run: node scripts/entropybot-release.mjs check
      - id: tools-contract
        run: node --test scripts/testing/tooling-types.node-test.mjs
      - id: types
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - id: patches
        run: node scripts/check-patches.mjs --verify
      - id: guards
        run: pnpm exec vitest run scripts/testing/file-size-ratchet.test.ts scripts/testing/verification-docs.test.ts src/locales/vocabulary.test.ts electron/updater.test.mjs server/local-computer.test.ts
  behavior-evals:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      OMB_EVAL_LIVE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: eval-types
        run: pnpm exec tsc -p evals/tsconfig.json
      - id: eval-tests
        run: pnpm exec vitest run --config evals/vitest.config.ts
      - id: scenarios
        run: pnpm eval
      - id: golden
        run: pnpm eval --golden
